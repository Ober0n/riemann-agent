name: Bug in rh
description: rh gives a wrong result or stops with an error.
labels: ["type/fix"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of rh version.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command that you ran, with its flags.
      render: sh
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What rh did, and what you expected.
    validations:
      required: true
